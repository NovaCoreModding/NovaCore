plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novacore'
    compileSdk 35

    defaultConfig {
        applicationId 'com.novacore'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'
}
